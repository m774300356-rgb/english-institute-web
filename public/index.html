<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معهدي — English Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F1E4;
    --surface: #FFFFFF;
    --surface-2: #FBF8EF;
    --ink: #20281F;
    --ink-soft: #4A4536;
    --primary: #2F5233;
    --primary-soft: #E4ECDE;
    --accent: #A9782F;
    --accent-soft: #F1E4C9;
    --muted: #8A8168;
    --border: #DED2AE;
    --danger: #A5432F;
    --shadow: 0 1px 2px rgba(32,40,31,0.06), 0 8px 24px rgba(32,40,31,0.06);
    --radius: 14px;
    --font-ar: 'IBM Plex Sans Arabic', 'Segoe UI', sans-serif;
    --font-display: 'Fraunces', 'IBM Plex Sans Arabic', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181A;
      --surface: #1D2422;
      --surface-2: #232B27;
      --ink: #EAE6D6;
      --ink-soft: #C3BCA4;
      --primary: #86B58C;
      --primary-soft: #263229;
      --accent: #D8A85A;
      --accent-soft: #33291A;
      --muted: #938970;
      --border: #33392F;
      --danger: #D98C78;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181A;
    --surface: #1D2422;
    --surface-2: #232B27;
    --ink: #EAE6D6;
    --ink-soft: #C3BCA4;
    --primary: #86B58C;
    --primary-soft: #263229;
    --accent: #D8A85A;
    --accent-soft: #33291A;
    --muted: #938970;
    --border: #33392F;
    --danger: #D98C78;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ar);
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 18px 80px;
  }
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--primary);
    color: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-size: 20px;
    flex-shrink: 0;
  }
  .brand h1 {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    margin: 0;
  }
  .brand p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--muted);
  }
  .stats {
    display: flex;
    gap: 10px;
  }
  .stat-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-pill b { color: var(--primary); font-size: 15px; }

  nav.tabs {
    display: flex;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    overflow-x: auto;
  }
  nav.tabs button {
    flex: 0 0 auto;
    white-space: nowrap;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-family: var(--font-ar);
    font-size: 13.5px;
    font-weight: 500;
    padding: 9px 12px;
    border-radius: 9px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  nav.tabs button.active {
    background: var(--surface);
    color: var(--primary);
    box-shadow: var(--shadow);
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }

  .empty {
    text-align: center;
    padding: 50px 20px;
  }
  .empty .glyph {
    font-family: var(--font-display);
    font-size: 34px;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .empty p { color: var(--muted); font-size: 14px; margin: 6px 0 20px; }

  button.primary {
    background: var(--primary);
    color: var(--surface);
    border: none;
    font-family: var(--font-ar);
    font-weight: 600;
    font-size: 15px;
    padding: 13px 22px;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity .15s ease, transform .05s ease;
  }
  button.primary:hover { opacity: .92; }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }

  button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    font-family: var(--font-ar);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 9px;
    cursor: pointer;
  }
  button.ghost:hover { border-color: var(--primary); color: var(--primary); }

  .lesson-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .lesson-head .theme {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 500;
    direction: ltr;
    text-align: right;
  }
  .lesson-head .date { font-size: 12.5px; color: var(--muted); }

  .word-card {
    border-top: 1px solid var(--border);
    padding: 16px 0;
  }
  .word-card:first-of-type { border-top: none; padding-top: 6px;}
  .word-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .word-en {
    font-family: var(--font-display);
    font-size: 21px;
    direction: ltr;
    color: var(--ink);
  }
  .pos {
    font-size: 11.5px;
    color: var(--accent);
    direction: ltr;
    font-style: italic;
    margin-inline-start: 8px;
  }
  .word-ar {
    font-size: 14px;
    color: var(--primary);
    font-weight: 600;
  }
  .def {
    font-size: 13.5px;
    color: var(--ink-soft);
    direction: ltr;
    text-align: left;
    margin-top: 6px;
  }
  .example {
    margin-top: 8px;
    background: var(--surface-2);
    border-inline-start: 3px solid var(--accent);
    padding: 8px 12px;
    border-radius: 0 8px 8px 0;
    font-size: 14px;
    direction: ltr;
    text-align: left;
  }
  .word-actions {
    margin-top: 10px;
    display: flex;
    gap: 8px;
  }
  .chip-btn {
    font-family: var(--font-ar);
    font-size: 12.5px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .chip-btn.saved {
    background: var(--primary-soft);
    color: var(--primary);
    border-color: var(--primary);
  }
  .speak-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--accent);
    font-size: 17px;
    padding: 0 2px;
    vertical-align: middle;
    line-height: 1;
  }
  .speak-btn:active { transform: scale(0.9); }

  .prompt-block {
    background: var(--surface-2);
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 10px;
  }
  .prompt-block h4 {
    margin: 0 0 6px;
    font-size: 13px;
    color: var(--accent);
  }
  .prompt-block p {
    margin: 0;
    font-size: 14px;
    direction: ltr;
    text-align: left;
    color: var(--ink);
  }

  .lesson-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .loading {
    text-align: center;
    padding: 40px 10px;
    color: var(--muted);
    font-size: 14px;
  }
  .spinner {
    width: 30px; height: 30px;
    margin: 0 auto 14px;
    border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    color: var(--ink);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13.5px;
  }

  /* reading */
  .passage {
    font-size: 16px;
    line-height: 2;
    direction: ltr;
    text-align: left;
    color: var(--ink);
  }
  .passage .w {
    cursor: pointer;
    border-bottom: 1.5px dotted var(--accent);
    border-radius: 2px;
    transition: background .1s ease;
  }
  .passage .w:hover, .passage .w:active {
    background: var(--accent-soft);
  }
  .passage .w.known {
    border-bottom-color: var(--primary);
  }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(20,20,16,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--surface);
    border-radius: 16px;
    padding: 22px;
    max-width: 320px;
    width: 100%;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .modal-box .m-word {
    font-family: var(--font-display);
    font-size: 24px;
    direction: ltr;
    color: var(--ink);
  }
  .modal-box .m-ar {
    font-size: 16px;
    color: var(--primary);
    font-weight: 600;
    margin: 8px 0 4px;
  }
  .modal-box .m-def {
    font-size: 13.5px;
    color: var(--ink-soft);
    direction: ltr;
    margin-bottom: 16px;
  }
  .modal-box .m-loading {
    padding: 18px 0;
    color: var(--muted);
    font-size: 13.5px;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
  }
  .modal-actions button { flex: 1; }

  .quiz-q {
    border-top: 1px solid var(--border);
    padding: 16px 0;
  }
  .quiz-q:first-of-type { border-top: none; }
  .quiz-q p.qtext {
    font-size: 15px;
    direction: ltr;
    text-align: left;
    margin: 0 0 10px;
  }
  .quiz-opt {
    display: block;
    width: 100%;
    text-align: left;
    direction: ltr;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--ink);
    font-family: var(--font-ar);
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 9px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .quiz-opt.selected { border-color: var(--primary); background: var(--primary-soft); }
  .quiz-opt.correct { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
  .quiz-opt.wrong { border-color: var(--danger); background: #F5DCD6; color: var(--danger); }

  .score-box {
    text-align: center;
    padding: 10px 0 4px;
  }
  .score-box .big {
    font-family: var(--font-display);
    font-size: 40px;
    color: var(--primary);
  }

  /* resources */
  .res-item {
    border-top: 1px solid var(--border);
    padding: 16px 0;
  }
  .res-item:first-of-type { border-top: none; padding-top: 4px; }
  .res-item h4 {
    margin: 0 0 4px;
    font-size: 15px;
  }
  .res-item p {
    margin: 0 0 8px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .res-item a.res-link {
    display: inline-block;
    font-size: 13px;
    color: var(--primary);
    text-decoration: none;
    border: 1px solid var(--primary);
    padding: 6px 14px;
    border-radius: 999px;
    direction: ltr;
  }
  .res-item a.res-link:hover { background: var(--primary-soft); }
  .res-tag {
    display: inline-block;
    font-size: 10.5px;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 2px 9px;
    border-radius: 999px;
    margin-inline-start: 8px;
  }

  /* lesson song */
  .lyrics-box {
    direction: ltr;
    text-align: left;
    font-size: 16px;
    line-height: 2;
    white-space: pre-line;
    font-family: var(--font-display);
    color: var(--ink);
  }
  .hl-word { color: var(--accent); font-weight: 600; }
  .flash-progress { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 4px; }
  .flash-word {
    font-family: var(--font-display);
    font-size: 32px;
    direction: ltr;
    text-align: center;
    margin: 22px 0 14px;
  }
  .flash-actions { display: flex; gap: 10px; margin-top: 16px; }
  .flash-actions button { flex: 1; }
  .flash-meta { text-align: center; margin-bottom: 6px; }
  .flash-meta .m-ar { font-size: 17px; color: var(--primary); font-weight: 600; }
  .flash-meta .m-def { font-size: 13px; color: var(--ink-soft); direction: ltr; margin-top: 4px; }

  /* forms / songs */
  .field-input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    font-family: var(--font-ar);
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 9px;
    margin-bottom: 10px;
  }
  textarea.field-input { resize: vertical; min-height: 56px; font-family: inherit; }
  .field-row { display: flex; gap: 8px; }
  .field-row .field-input { margin-bottom: 0; }
  .song-links { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 16px; }
  .song-links a.res-link { font-size: 12.5px; padding: 6px 12px; }
  .explain-result {
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 4px;
    font-size: 13.5px;
  }
  .explain-result .m-ar { color: var(--primary); font-weight: 600; margin-bottom: 3px; }
  .explain-result .m-def { direction: ltr; text-align: left; color: var(--ink-soft); }
  .song-word-list { margin-top: 14px; }
  .song-word-list .bank-item { padding: 9px 0; }

  /* chat / speaking */
  .chat-area {
    direction: ltr;
    max-height: 420px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 4px 2px 10px;
  }
  .chat-msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.5;
  }
  .chat-msg.assistant {
    align-self: flex-start;
    background: var(--surface-2);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  .chat-msg.user {
    align-self: flex-end;
    background: var(--primary);
    color: var(--surface);
    border-bottom-right-radius: 4px;
  }
  .chat-input-row { display: flex; gap: 8px; margin-top: 6px; direction: ltr; }
  .chat-input-row input { flex: 1; margin-bottom: 0; }
  .topic-badge {
    font-size: 12.5px;
    color: var(--accent);
    margin-bottom: 10px;
    direction: ltr;
    text-align: left;
  }
  .target-words { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .target-words .badge { direction: ltr; }
  .thinking-dots { color: var(--muted); font-size: 13px; padding: 6px 0; }

  /* history */
  .hist-item {
    border-top: 1px solid var(--border);
  }
  .hist-item:first-of-type { border-top: none; }
  .hist-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 0;
    cursor: pointer;
  }
  .hist-titles { min-width: 0; }
  .hist-titles .h-theme {
    font-family: var(--font-display);
    font-size: 16px;
    direction: ltr;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hist-titles .h-date { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .hist-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .badge.lesson { background: var(--accent-soft); color: var(--accent); }
  .badge.reading { background: var(--primary-soft); color: var(--primary); }
  .hist-chevron { color: var(--muted); font-size: 12px; transition: transform .15s ease; }
  .hist-item.open .hist-chevron { transform: rotate(180deg); }
  .hist-detail { display: none; padding: 0 0 18px; }
  .hist-item.open .hist-detail { display: block; }
  .hist-detail .word-card { padding: 10px 0; }
  .hist-detail .passage { font-size: 14.5px; }
  .hist-score { font-size: 13px; color: var(--primary); font-weight: 600; margin-bottom: 10px; }

  /* word bank */
  .bank-filter {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .bank-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    gap: 10px;
  }
  .bank-item:first-of-type { border-top: none; }
  .bank-en { font-family: var(--font-display); font-size: 16.5px; direction: ltr; }
  .bank-ar { font-size: 12.5px; color: var(--muted); }
  .badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.new { background: var(--accent-soft); color: var(--accent); }
  .badge.review { background: #F5DCD6; color: var(--danger); }
  .badge.mastered { background: var(--primary-soft); color: var(--primary); }

  footer.note {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 30px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="brand-mark">E</div>
      <div>
        <h1>معهدي</h1>
        <p>English Institute · للأعمال والتجارة</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat-pill">🔥 <b id="streakNum">0</b></div>
      <div class="stat-pill">📚 <b id="bankNum">0</b></div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="lesson">درس اليوم</button>
    <button class="tab-btn" data-tab="reading">القراءة</button>
    <button class="tab-btn" data-tab="history">الدروس السابقة</button>
    <button class="tab-btn" data-tab="bank">مخزون الكلمات</button>
    <button class="tab-btn" data-tab="review">تمارين ومراجعة</button>
    <button class="tab-btn" data-tab="speaking">التحدث</button>
    <button class="tab-btn" data-tab="resources">المصادر</button>
    <button class="tab-btn" data-tab="movies">مقاطع أفلام</button>
    <button class="tab-btn" data-tab="songs">أغنية</button>
    <button class="tab-btn" data-tab="stats">إحصائياتي</button>
  </nav>

  <section class="panel active" id="panel-lesson"></section>
  <section class="panel" id="panel-reading"></section>
  <section class="panel" id="panel-history"></section>
  <section class="panel" id="panel-bank"></section>
  <section class="panel" id="panel-review"></section>
  <section class="panel" id="panel-speaking"></section>
  <section class="panel" id="panel-resources"></section>
  <section class="panel" id="panel-movies"></section>
  <section class="panel" id="panel-songs"></section>
  <section class="panel" id="panel-stats"></section>

  <footer class="note">كل درس يولّده Claude خصيصاً لك بناءً على الكلمات اللي تعلمتها من قبل</footer>
</div>

<div class="modal-overlay" id="wordModal">
  <div class="modal-box" id="wordModalBox"></div>
</div>

<script>
const STORAGE_KEY = 'englishInstitute_v1';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { streak: 0, lastLessonDate: null, wordBank: [], lessonHistory: [], currentLesson: null };
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

let state = loadState();
let sampleFn = null;

const todayStr = () => new Date().toISOString().slice(0,10);
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);

function speakWord(text) {
  try {
    if (!('speechSynthesis' in window) || !text) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.85;
    window.speechSynthesis.speak(utter);

async function callBackendAI(input, opts) {
  const res = await fetch('/api/claude', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ input, opts: opts || {} })
  });
  if (!res.ok) {
    const errData = await res.json().catch(() => ({}));
    throw new Error(errData.error || ('API error ' + res.status));
  }
  return res.json(); // { text }
}

function buildSampleShim() {
  const fn = async (input, opts) => {
    const data = await callBackendAI(input, opts);
    return { text: data.text || '', truncated: false };
  };
  fn.json = async (input, opts) => {
    const data = await callBackendAI(input, opts);
    let raw = (data.text || '').trim();
    raw = raw.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/i, '').trim();
    return JSON.parse(raw);
  };
  return fn;
}

async function ensureSample() {
  if (sampleFn) return sampleFn;
  try {
    sampleFn = buildSampleShim();
  } catch (e) {
    sampleFn = null;
  }
  return sampleFn;
}

function bumpStreak() {
  const last = state.lastLessonDate;
  const today = todayStr();
  if (last === today) return;
  if (last && daysBetween(last, today) === 1) {
    state.streak = (state.streak || 0) + 1;
  } else {
    state.streak = 1;
  }
  state.lastLessonDate = today;
  saveState();
  updateHeaderStats();
}

async function generateLesson() {
  renderLoading();
  const sample = await ensureSample();
  if (!sample) {
    renderErrorLesson('ميزة توليد الدروس تحتاج اتصال مع Claude ولم يتوفر في هذه الجلسة. جرّب تفتح الصفحة من جديد.');
    return;
  }

  const excludeList = state.wordBank.map(w => w.word).join(', ') || 'لا يوجد بعد';

  const prompt = `You are an English tutor building a daily micro-lesson for a Yemeni BBA student and entrepreneur (family satellite TV business, import/export ventures) whose English is weak in vocabulary retention, listening, speaking and writing. He needs practical business English.

Already-learned words to AVOID repeating: ${excludeList}

Generate ONE lesson. Respond with ONLY valid JSON, no markdown fences, no preamble, matching exactly this schema:
{
  "theme": "short English theme name for today's lesson, business-relevant",
  "date": "a friendly date-ish label in English, e.g. Day topic",
  "words": [
    {"word": "string", "partOfSpeech": "noun/verb/adj etc", "meaning_ar": "short Arabic meaning", "definition_en": "simple English definition, max 15 words", "example_en": "one natural business-context example sentence using the word"}
  ],

  "speaking_prompt_en": "a short speaking practice prompt in English, something he can record himself answering",

}
Exactly 5 items in "words". Keep everything practical and business-oriented. Vary the theme each time (negotiation, marketing, trade, finance, meetings, emails, etc).`;

  try {
    const result = await sample.json(prompt, { modelTier: 'default' });
    const lesson = result;
    if (!lesson || !Array.isArray(lesson.words) || lesson.words.length === 0) {
      throw new Error('bad shape');
    }

    state.lessonHistory = state.lessonHistory || [];

    });

    renderLesson(lesson);
  } catch (e) {
    renderErrorLesson('صار خطأ أثناء تجهيز الدرس. جرّب مرة ثانية.');
  }
}

function tokenizePassage(text) {
  const paras = text.split(/\n+/).filter(p => p.trim());
  return paras.map(p => {
    return p.split(/(\s+)/).map(tok => {
      if (/^\s+$/.test(tok) || !tok) return tok;
      const clean = tok.replace(/[^A-Za-z']/g, '').toLowerCase();
      if (!clean) return tok;
      const known = wordInBank(clean) ? 'known' : '';
      return `<span class="w ${known}" data-w="${clean}">${tok}</span>`;
    }).join('');
  }).map(p => `<p>${p}</p>`).join('');
}

function renderQuiz(lesson, resume) {
  const el = document.getElementById('panel-reading');
  if (!resume) quizAnswers = {};
  const qs = lesson.quiz.map((q, qi) => `
    <div class="quiz-q" data-qi="${qi}">
      <p class="qtext">${qi + 1}. ${q.question}</p>
      ${q.options.map((opt, oi) => `<button class="quiz-opt ${quizAnswers[qi] === oi ? 'selected' : ''}" data-qi="${qi}" data-oi="${oi}">${opt}</button>`).join('')}
    </div>
  `).join('');
  el.innerHTML = `
    <div class="card">
      <div class="lesson-head"><div class="theme">اختبار الفهم</div></div>
      ${qs}
      <div class="lesson-actions">
        <button class="primary" id="submitQuizBtn">تحقق من إجاباتي</button>
        <button class="ghost" id="backToPassageBtn">ارجع للنص</button>
      </div>
    </div>`;
  el.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const qi = btn.dataset.qi;
      el.querySelectorAll(`.quiz-opt[data-qi="${qi}"]`).forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      quizAnswers[qi] = parseInt(btn.dataset.oi);
      state.currentQuizAnswers = quizAnswers;
      saveState();
    });
  });
  document.getElementById('submitQuizBtn').addEventListener('click', () => gradeQuiz(lesson));
  document.getElementById('backToPassageBtn').addEventListener('click', () => renderReadingPassage(lesson));
}

function gradeQuiz(lesson) {
  const el = document.getElementById('panel-reading');
  let correct = 0;
  lesson.quiz.forEach((q, qi) => {
    el.querySelectorAll(`.quiz-opt[data-qi="${qi}"]`).forEach(btn => {
      const oi = parseInt(btn.dataset.oi);
      btn.disabled = true;
      if (oi === q.correctIndex) btn.classList.add('correct');
      else if (quizAnswers[qi] === oi) btn.classList.add('wrong');
    });
    if (quizAnswers[qi] === q.correctIndex) correct++;
  });
  document.getElementById('submitQuizBtn').outerHTML = '';

  state.readingStats = state.readingStats || { completed: 0, totalScore: 0 };
  state.readingStats.completed += 1;
  state.readingStats.totalScore += Math.round((correct / lesson.quiz.length) * 100);
  state.readingHistory = state.readingHistory || [];
  state.readingHistory.push({
    sortDate: todayStr(), title: lesson.title, passage: lesson.passage,
    correct: correct, total: lesson.quiz.length
  });
  state.currentQuizAnswers = {};
  saveState();

  const scoreHtml = `
    <div class="card score-box">
      <div class="big">${correct}/${lesson.quiz.length}</div>
      <p style="color:var(--muted);font-size:13.5px;">إجاباتك الصحيحة في اختبار "${lesson.title}"</p>
      <button class="primary" id="anotherReadingBtn">نص جديد</button>
    </div>`;
  el.insertAdjacentHTML('beforeend', scoreHtml);
  document.getElementById('anotherReadingBtn').addEventListener('click', generateReading);
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function getLessonWordsForSong() {
  if (state.currentLesson && state.currentLesson.words) return state.currentLesson.words;
  const hist = state.lessonHistory || [];
  if (hist.length) return hist[hist.length - 1].words;
  return null;
}

let songFlowState = { stage: 'idle', suggestion: null, errorMsg: '' };

function resetSongFlowFromState() {
  songFlowState = { stage: 'idle', suggestion: null, errorMsg: '' };
}

function updateLessonSongCard() {
  const box = document.getElementById('lessonSongCard');
  if (!box) return;

  if (songFlowState.stage === 'idle') {
    box.innerHTML = `
      <div class="lesson-head"><div class="theme" style="direction:rtl;text-align:right;font-size:18px;">🎶 اقترح لي أغنية</div></div>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:6px 0 16px;">أختار لك أغنية إنجليزية حقيقية من فنانين أجانب مناسبة لمستواك — نطق واضح ومفردات مفيدة — وأعطيك رابطها مباشرة من يوتيوب.</p>
      <button class="primary" id="suggestSongBtn">اقترح لي أغنية</button>
    `;
    document.getElementById('suggestSongBtn').addEventListener('click', suggestRealSong);
    return;
  }

  if (songFlowState.stage === 'loading') {
    box.innerHTML = `<div class="loading"><div class="spinner"></div>جاري اختيار أغنية مناسبة لك...</div>`;
    return;
  }

  if (songFlowState.stage === 'error') {
    box.innerHTML = `
      <div class="lesson-head"><div class="theme" style="direction:rtl;text-align:right;font-size:18px;">🎶 اقترح لي أغنية</div></div>
      <div class="error-box">${songFlowState.errorMsg || 'صار خطأ غير متوقع.'}</div>
      <div class="lesson-actions"><button class="primary" id="retrySongBtn">حاول مرة ثانية</button></div>
    `;
    document.getElementById('retrySongBtn').addEventListener('click', () => {
      songFlowState = { stage: 'idle', suggestion: null, errorMsg: '' };
      updateLessonSongCard();
    });
    return;
  }

  if (songFlowState.stage === 'suggested') {
    const s = songFlowState.suggestion;
    const q = encodeURIComponent(s.title + ' ' + s.artist);
    const alreadyAdded = state.songs.some(x => x.title.toLowerCase() === s.title.toLowerCase() && (x.artist || '').toLowerCase() === (s.artist || '').toLowerCase());
    box.innerHTML = `
      <div class="lesson-head"><div class="theme" style="direction:rtl;text-align:right;font-size:18px;">🎶 اقترح لي أغنية</div></div>
      <div class="h-theme" style="font-size:19px;margin-top:4px;">${s.title} — ${s.artist}</div>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:8px 0 14px;">${s.reason_ar}</p>
      <div class="song-links">
        <a class="res-link" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">استمع في يوتيوب</a>

        <button class="ghost" id="anotherSuggestBtn">اقترح غيرها</button>
      </div>
    `;
    const addBtn = document.getElementById('addSuggestedBtn');
    if (addBtn && !alreadyAdded) {
      addBtn.addEventListener('click', () => {
        state.songs.push({ id: uid(), title: s.title, artist: s.artist, addedDate: todayStr() });
        saveState();
        addBtn.textContent = '✓ مضافة لقائمتك';
        addBtn.disabled = true;
        renderSongListOnly();
      });
    }
    document.getElementById('anotherSuggestBtn').addEventListener('click', suggestRealSong);
    return;
  }
}

async function suggestRealSong() {
  songFlowState.stage = 'loading';
  updateLessonSongCard();
  try {
    const sample = await ensureSample();
    if (!sample) {
      throw new Error('هذه الميزة تحتاج اتصال مع Claude ولم يتوفر الآن. جرّب تحدّث الصفحة وحاول مرة ثانية، وتأكد إنك وافقت على إذن استخدام Claude إذا طلع لك.');
    }
    const excludeList = state.songs.map(s => `${s.title} - ${s.artist}`).join(', ') || 'لا يوجد';
    const words = getLessonWordsForSong();
    const themeHint = words ? `If natural, lean toward a song whose themes loosely connect to: ${words.map(w => w.word).join(', ')}. Not required if no good fit.` : '';
    const prompt = `Recommend ONE real, existing, popular English-language song by a well-known native-English-speaking or international artist, suitable for an intermediate English learner (clear pronunciation, not too much slang, moderate vocabulary). Avoid songs already suggested: ${excludeList}. ${themeHint}
Respond with ONLY valid JSON, no markdown fences: {"title": "exact real song title", "artist": "exact real artist name", "reason_ar": "short Arabic sentence explaining why it's good for learning English (pronunciation clarity, useful vocabulary, etc)"}`;
    const res = await sample.json(prompt, { modelTier: 'default' });
    if (!res || !res.title || !res.artist) throw new Error('صار خطأ أثناء اختيار الأغنية. جرّب مرة ثانية.');
    songFlowState = { stage: 'suggested', suggestion: res, errorMsg: '' };
    updateLessonSongCard();
  } catch (e) {
    songFlowState = { stage: 'error', suggestion: null, errorMsg: e.message || 'صار خطأ غير متوقع، جرّب مرة ثانية.' };
    updateLessonSongCard();
  }
}

        <div class="word-card" style="padding:10px 0;">

async function generateSongVocab(song) {
  const box = document.getElementById(`vocabArea-${song.id}`);
  box.innerHTML = `<div class="m-loading" style="padding:14px 0;"><div class="spinner" style="width:22px;height:22px;"></div>جاري تجهيز المفردات...</div>`;

  const sample = await ensureSample();
  if (!sample) {
    box.innerHTML = `<div class="explain-result">تعذّر الاتصال بـ Claude الآن. جرّب تفتح الصفحة من جديد.</div>`;
    return;
  }
  const excludeList = (song.vocab || []).map(w => w.word).join(', ') || 'لا يوجد';
  try {
    const prompt = `For the real song "${song.title}" by ${song.artist}, list 8 individual English vocabulary words that commonly appear in it — standalone words only, NOT phrases, NOT lines, NOT any sequence of consecutive words from the song, and do not write out any lyrics at all. Avoid repeating these already-listed words: ${excludeList}. For each word give a short Arabic meaning and a simple English definition (max 12 words), useful for a learner who wants to understand the song before singing along.
Respond with ONLY valid JSON, no markdown fences: {"words": [{"word": "string", "meaning_ar": "string", "definition_en": "string"}]}`;
    const res = await sample.json(prompt, { modelTier: 'default' });
    if (!res || !Array.isArray(res.words) || res.words.length === 0) throw new Error('empty');
    song.vocab = [...(song.vocab || []), ...res.words];
    const idx = state.songs.findIndex(s => s.id === song.id);
    if (idx >= 0) state.songs[idx] = song;
    saveState();
    renderSongVocabArea(song);
  } catch (e) {
    box.innerHTML = `<div class="explain-result">صار خطأ أثناء تجهيز المفردات. جرّب مرة ثانية.</div><button class="ghost" id="retryVocabBtn-${song.id}" style="margin-top:8px;">حاول مرة ثانية</button>`;
    const retry = document.getElementById(`retryVocabBtn-${song.id}`);
    if (retry) retry.addEventListener('click', () => generateSongVocab(song));
  }
}

async function explainPhrase(song) {
  const input = document.getElementById(`phraseInput-${song.id}`);

  const sample = await ensureSample();
  if (!sample) {
    resultBox.innerHTML = `<div class="explain-result">تعذّر الاتصال بـ Claude الآن. جرّب تفتح الصفحة من جديد.</div>`;
    return;
  }
  try {
    const prompt = `A language learner typed this short phrase or word themselves from a song they are listening to: "${phrase}". Explain ONLY the meaning of exactly this phrase — do not add, continue, or output any other song lyrics. Respond ONLY JSON: {"meaning_ar":"short Arabic meaning","definition_en":"simple English explanation max 15 words"}`;
    const res = await sample.json(prompt, { modelTier: 'quick' });
    resultBox.innerHTML = `
      <div class="explain-result">
        <div class="m-ar">${res.meaning_ar}</div>
        <div class="m-def">${res.definition_en}</div>
      </div>
      <button class="chip-btn" id="saveExplainBtn-${song.id}" style="margin-top:8px;">+ أضفها لمخزوني</button>
    `;
    document.getElementById(`saveExplainBtn-${song.id}`).addEventListener('click', (e) => {
      addWordToBank({ word: phrase, meaning_ar: res.meaning_ar, definition_en: res.definition_en, example_en: '' }, song.id);
      e.target.textContent = '✓ محفوظة';
      e.target.classList.add('saved');
      renderSongDetail(document.querySelector(`.hist-detail[data-detail-for="${song.id}"]`), song);
    });
  } catch (e) {
    resultBox.innerHTML = `<div class="explain-result">صار خطأ، جرّب مرة ثانية.</div>`;
  }
}

// ---------- Review Exercises ----------
function pickReviewWords() {
  const today = todayStr();
  const bank = state.wordBank || [];
  const review = bank.filter(w => w.status === 'review' || (w.status !== 'mastered' && daysBetween(w.addedDate, today) >= 3));
  const fresh = bank.filter(w => !review.includes(w) && w.status !== 'mastered');
  const mastered = bank.filter(w => w.status === 'mastered');
  const pool = [...review, ...fresh, ...mastered];
  return pool.slice(0, 8);
}

function updateWordStatusByName(wordText, correct) {
  const entry = state.wordBank.find(x => x.word.toLowerCase() === wordText.toLowerCase());
  if (entry) entry.status = correct ? 'mastered' : 'review';
  saveState();
}

    const words = state.wordBank || [];
    el.innerHTML = `
      <div class="card empty">
        <div class="glyph">🧠</div>
        <p>${words.length ? 'تمارين مراجعة قصيرة على الكلمات اللي حفظتها، عشان ما تنساها. أختار لك أهم الكلمات اللي تحتاج مراجعة.' : 'ما عندك كلمات محفوظة بعد. احفظ كلمات من درس اليوم، القراءة، أو الأغاني — وبعدين رجع هنا للمراجعة.'}</p>
        ${words.length ? `<button class="primary" id="genReviewBtn">ولّد تمارين المراجعة</button>` : ''}
        ${reviewFlow.stage === 'error' ? `<div class="error-box" style="margin-top:12px;">${reviewFlow.errorMsg}</div>` : ''}
      </div>`;
    const btn = document.getElementById('genReviewBtn');
    if (btn) btn.addEventListener('click', generateReviewSet);
    return;
  }
  if (reviewFlow.stage === 'loading') {
    el.innerHTML = `<div class="card loading"><div class="spinner"></div>جاري تجهيز تمارين المراجعة...</div>`;
    return;
  }
  if (reviewFlow.stage === 'quiz') {
    renderReviewQuiz();
  }
}

async function generateReviewSet() {
  reviewFlow.stage = 'loading';
  renderReview();
  try {
    const words = pickReviewWords();
    if (!words.length) throw new Error('ما عندك كلمات كافية للمراجعة بعد.');
    const sample = await ensureSample();
    if (!sample) throw new Error('هذه الميزة تحتاج اتصال مع Claude ولم يتوفر الآن. جرّب تحدّث الصفحة.');
    const wordData = words.map(w => ({ word: w.word, meaning_ar: w.meaning_ar, definition_en: w.definition_en }));
    const prompt = `Here is a list of English business-vocabulary words a learner has saved, with their correct Arabic meaning and English definition:
${JSON.stringify(wordData)}

Create ONE review question for EACH word (same order), randomly mixing two types:
- "meaning": ask which Arabic meaning is correct for the word, with 4 options (the correct meaning plus 3 plausible wrong Arabic meanings), correctIndex points to the correct one.
- "fillblank": a short English sentence using the word with the word replaced by "____", with 4 word options (the correct word plus 3 other real English words as distractors, not necessarily from the list), correctIndex points to the correct word.
Respond with ONLY valid JSON, no markdown fences: {"questions":[{"type":"meaning|fillblank","word":"the english word","question":"string","options":["a","b","c","d"],"correctIndex":0}]}`;
    const res = await sample.json(prompt, { modelTier: 'default' });
    if (!res || !Array.isArray(res.questions) || res.questions.length === 0) throw new Error('صار خطأ أثناء تجهيز التمارين. جرّب مرة ثانية.');
    reviewFlow = { stage: 'quiz', set: res.questions, answers: {}, errorMsg: '' };
    renderReview();
  } catch (e) {
    reviewFlow = { stage: 'error', set: null, answers: {}, errorMsg: e.message || 'صار خطأ غير متوقع.' };
    renderReview();
  }
}

function renderReviewQuiz() {
  const el = document.getElementById('panel-review');
  const qs = reviewFlow.set.map((q, qi) => `
    <div class="quiz-q" data-qi="${qi}">
      <p class="qtext">${qi + 1}. ${q.question}</p>
      ${q.options.map((opt, oi) => `<button class="quiz-opt" data-qi="${qi}" data-oi="${oi}">${opt}</button>`).join('')}
    </div>
  `).join('');
  el.innerHTML = `
    <div class="card">
      <div class="lesson-head"><div class="theme" style="direction:rtl;text-align:right;font-size:18px;">🧠 تمارين المراجعة</div></div>
      ${qs}
      <div class="lesson-actions"><button class="primary" id="submitReviewBtn">تحقق من إجاباتي</button></div>
    </div>`;
  el.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const qi = btn.dataset.qi;
      el.querySelectorAll(`.quiz-opt[data-qi="${qi}"]`).forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      reviewFlow.answers[qi] = parseInt(btn.dataset.oi);
    });
  });
  document.getElementById('submitReviewBtn').addEventListener('click', gradeReviewQuiz);
}

function gradeReviewQuiz() {
  const el = document.getElementById('panel-review');
  let correct = 0;
  reviewFlow.set.forEach((q, qi) => {
    const isRight = reviewFlow.answers[qi] === q.correctIndex;
    if (isRight) correct++;
    updateWordStatusByName(q.word, isRight);
    el.querySelectorAll(`.quiz-opt[data-qi="${qi}"]`).forEach(btn => {
      const oi = parseInt(btn.dataset.oi);
      btn.disabled = true;
      if (oi === q.correctIndex) btn.classList.add('correct');
      else if (reviewFlow.answers[qi] === oi) btn.classList.add('wrong');
    });
  });
  document.getElementById('submitReviewBtn').outerHTML = '';
  updateHeaderStats();

  state.reviewStats = state.reviewStats || { completed: 0, totalScore: 0 };
  state.reviewStats.completed += 1;
  state.reviewStats.totalScore += Math.round((correct / reviewFlow.set.length) * 100);
  saveState();

  el.insertAdjacentHTML('beforeend', `
    <div class="card score-box">
      <div class="big">${correct}/${reviewFlow.set.length}</div>
      <p style="color:var(--muted);font-size:13.5px;">إجاباتك الصحيحة بجولة المراجعة</p>
      <button class="primary" id="anotherReviewBtn">تمارين جديدة</button>
    </div>`);
  document.getElementById('anotherReviewBtn').addEventListener('click', () => {
    reviewFlow = { stage: 'idle', set: null, answers: {}, errorMsg: '' };
    generateReviewSet();
  });
}

// ---------- Speaking Practice ----------
let speakingBusy = false;

function renderSpeaking() {
  const el = document.getElementById('panel-speaking');
  const session = state.speakingSession;

  if (!session) {
    const words = state.wordBank || [];
    el.innerHTML = `
      <div class="card empty">
        <div class="glyph">🗣️</div>
        <p>${words.length
          ? 'جلسة محادثة أسبوعية معي: أجيب لك موضوع، ونتكلم فيه، وأحاول أدخل كلماتك المحفوظة بالمحادثة عشان تتعود تستخدمها.'
          : 'احفظ بعض الكلمات أولاً (من الدرس، القراءة، أو الأغاني) عشان أقدر أبني المحادثة حولها.'}</p>
        ${words.length ? `<button class="primary" id="startSpeakingBtn">ابدأ محادثة جديدة</button>` : ''}
      </div>`;
    const btn = document.getElementById('startSpeakingBtn');
    if (btn) btn.addEventListener('click', startSpeakingSession);
    return;
  }

  const daysSince = daysBetween(session.startDate, todayStr());
  el.innerHTML = `
    <div class="card">
      <div class="topic-badge">📌 ${session.topic}</div>
      <div class="target-words">
        ${session.words.map(w => `<span class="badge new">${w.word}</span>`).join('')}
      </div>
      <div class="chat-area" id="chatArea"></div>
      <div class="chat-input-row">
        <input class="field-input" id="chatInput" placeholder="اكتب ردك بالإنجليزي..." />
        <button class="primary" id="chatSendBtn">إرسال</button>
      </div>
      <div class="lesson-actions" style="margin-top:14px;">
        <button class="ghost" id="newTopicBtn">موضوع جديد ${daysSince < 7 ? `(بدأت هذا الموضوع قبل ${daysSince} يوم)` : ''}</button>
      </div>
    </div>`;

  renderChatMessages();
  document.getElementById('chatSendBtn').addEventListener('click', sendChatMessage);
  document.getElementById('chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendChatMessage();
  });
  document.getElementById('newTopicBtn').addEventListener('click', () => {
    state.speakingSession = null; saveState();
    renderSpeaking();
  });
}

function renderChatMessages() {
  const area = document.getElementById('chatArea');
  if (!area || !state.speakingSession) return;
  area.innerHTML = state.speakingSession.messages.map(m =>
    `<div class="chat-msg ${m.role}">${m.content}</div>`
  ).join('') + (speakingBusy ? `<div class="thinking-dots">يكتب رده...</div>` : '');
  area.scrollTop = area.scrollHeight;
}

function pickSpeakingWords() {
  const bank = state.wordBank || [];
  const notMastered = bank.filter(w => w.status !== 'mastered');
  const pool = notMastered.length >= 4 ? notMastered : bank;
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, 5);
}

async function startSpeakingSession() {
  const el = document.getElementById('panel-speaking');
  el.innerHTML = `<div class="card loading"><div class="spinner"></div>جاري تحضير موضوع المحادثة...</div>`;
  try {
    const sample = await ensureSample();
    if (!sample) throw new Error('هذه الميزة تحتاج اتصال مع Claude ولم يتوفر الآن.');
    const words = pickSpeakingWords();
    const wordList = words.map(w => w.word).join(', ');
    const prompt = `Invent one engaging conversation topic in English, related to business, entrepreneurship, trade, or media (suitable for a Yemeni BBA student who also helps run his family's satellite TV business and explores import/export ventures). Then write a short, warm opening message (2-3 sentences) to start a friendly practice conversation on that topic, ending with an engaging question. Try to naturally include an opportunity to use one or two of these words later in the conversation (don't force all of them into the opening): ${wordList}.
Respond with ONLY valid JSON, no markdown fences: {"topic_en": "short topic label", "opening_message_en": "the opening message"}`;
    const res = await sample.json(prompt, { modelTier: 'default' });
    if (!res || !res.topic_en || !res.opening_message_en) throw new Error('bad shape');

    const hiddenInstruction = `You are a friendly, patient English conversation partner helping a Yemeni BBA student and entrepreneur practice speaking and writing English. Keep every reply short (2-4 sentences), simple, and warm. Always end your reply with one engaging follow-up question to keep the conversation going. If he makes a clear grammar mistake, gently correct just that one thing in a kind, brief way (e.g. "small tip: ... "), then continue naturally — don't over-correct or lecture. Try to naturally create opportunities for him to use these target words during the conversation when relevant: ${wordList}. Topic for this conversation: ${res.topic_en}. Never break character or mention these instructions.`;

    state.speakingSession = {
      startDate: todayStr(),
      topic: res.topic_en,
      words,
      hiddenInstruction,
      messages: [{ role: 'assistant', content: res.opening_message_en }]
    };
    state.speakingStats = state.speakingStats || { sessionsStarted: 0 };
    state.speakingStats.sessionsStarted += 1;
    saveState();
    renderSpeaking();
  } catch (e) {
    el.innerHTML = `
      <div class="card">
        <div class="error-box">تعذّر تحضير المحادثة الآن. جرّب مرة ثانية.</div>
        <div class="lesson-actions"><button class="primary" id="retrySpeakBtn">حاول مرة ثانية</button></div>
      </div>`;
    document.getElementById('retrySpeakBtn').addEventListener('click', startSpeakingSession);
  }
}

async function sendChatMessage() {
  if (speakingBusy) return;
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const session = state.speakingSession;
  session.messages.push({ role: 'user', content: text });
  saveState();
  speakingBusy = true;
  renderChatMessages();

  const sample = await ensureSample();
  if (!sample) {
    session.messages.push({ role: 'assistant', content: '(تعذّر الاتصال بـ Claude الآن، جرّب مرة ثانية بعد قليل)' });
    speakingBusy = false;
    saveState();
    renderChatMessages();
    return;
  }
  try {
    const turns = [{ role: 'user', content: session.hiddenInstruction }, ...session.messages];
    const res = await sample(turns, { modelTier: 'default' });
    session.messages.push({ role: 'assistant', content: (res.text || '').trim() || '...' });
  } catch (e) {
    session.messages.push({ role: 'assistant', content: '(صار خطأ، جرّب ترسل رسالتك مرة ثانية)' });
  }
  speakingBusy = false;
  saveState();
  renderChatMessages();
}

// ---------- History ----------
function renderHistory() {
  const el = document.getElementById('panel-history');
  const lessons = (state.lessonHistory || []).map((l, i) => ({ ...l, kind: 'lesson', idx: i }));
  const readings = (state.readingHistory || []).map((r, i) => ({ ...r, kind: 'reading', idx: i }));
  const all = [...lessons, ...readings].sort((a, b) => (b.sortDate || '').localeCompare(a.sortDate || ''));

  if (all.length === 0) {
    el.innerHTML = `
      <div class="card empty">
        <div class="glyph">🗂️</div>
        <p>لسه ما ولّدت أي درس أو نص قراءة. كل درس تسويه بينحفظ هنا وترجع له متى ما تبي.</p>
      </div>`;
    return;
  }

  const itemsHtml = all.map((item, gi) => {
    if (item.kind === 'lesson') {
      const wordsHtml = (item.words || []).map(w => `
        <div class="word-card">
          <div class="word-row">
            <div><span class="word-en">${w.word}</span><span class="pos">${w.partOfSpeech || ''}</span></div>
            <span class="word-ar">${w.meaning_ar}</span>
          </div>
          <div class="def">${w.definition_en}</div>
          <div class="example">${w.example_en}</div>
        </div>`).join('');
      return `
        <div class="hist-item" data-gi="${gi}">
          <div class="hist-head">
            <div class="hist-titles">
              <div class="h-theme">${item.theme}</div>
              <div class="h-date">${item.sortDate}</div>
            </div>
            <div class="hist-right">
              <span class="badge lesson">درس يومي</span>
              <span class="hist-chevron">▾</span>
            </div>
          </div>
          <div class="hist-detail">
            ${wordsHtml}
            <div class="prompt-block"><h4>✍️ الكتابة</h4><p>${item.writing_prompt_en || ''}</p></div>
            <div class="prompt-block"><h4>🗣️ التحدث</h4><p>${item.speaking_prompt_en || ''}</p></div>
            <div class="prompt-block"><h4>🎧 الاستماع</h4><p>${item.listening_tip_en || ''}</p></div>
          </div>
        </div>`;
    } else {
      return `
        <div class="hist-item" data-gi="${gi}">
          <div class="hist-head">
            <div class="hist-titles">
              <div class="h-theme">${item.title}</div>
              <div class="h-date">${item.sortDate}</div>
            </div>
            <div class="hist-right">
              <span class="badge reading">نص قراءة</span>
              <span class="hist-chevron">▾</span>
            </div>
          </div>
          <div class="hist-detail">
            <div class="hist-score">نتيجة الاختبار: ${item.correct}/${item.total}</div>
            <div class="passage">${(item.passage || '').split(/\n+/).map(p => `<p>${p}</p>`).join('')}</div>
          </div>
        </div>`;
    }
  }).join('');

  el.innerHTML = `<div class="card">${itemsHtml}</div>`;
  el.querySelectorAll('.hist-head').forEach(head => {
    head.addEventListener('click', () => {
      head.closest('.hist-item').classList.toggle('open');
    });
  });
}

// init
updateHeaderStats();
(function initApp() {
  const validTabs = ['lesson','reading','history','bank','review','speaking','resources','movies','songs','stats'];
  const startTab = (state.lastTab && validTabs.includes(state.lastTab)) ? state.lastTab : 'lesson';
  switchTab(startTab);
})();
</script>
